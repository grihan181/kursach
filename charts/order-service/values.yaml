image:
  repository: order-service
  tag: latest
  pullPolicy: IfNotPresent

env:
  APP_DATABASE_URL: postgresql://order:order@order-service-postgresql:5432/orders
  APP_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APP_JWT_SECRET: changeme
  APP_OTLP_ENDPOINT: http://otel-collector:4317

service:
  type: ClusterIP
  port: 8000

postgresql:
  auth:
    username: order
    password: order
    database: orders

resources: {}
