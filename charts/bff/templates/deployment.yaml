apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bff.fullname" . }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bff.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: API_PREFIX
              value: {{ .Values.env.apiPrefix | quote }}
            - name: AUTH_SERVICE_URL
              value: {{ .Values.env.authServiceUrl | quote }}
            - name: ORDERS_SERVICE_URL
              value: {{ .Values.env.ordersServiceUrl | quote }}
            - name: CHAT_SERVICE_URL
              value: {{ .Values.env.chatServiceUrl | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "bff.fullname" . }}
                  key: jwtSecret
            - name: HTTP_TIMEOUT_MS
              value: {{ .Values.env.httpTimeoutMs | quote }}
            - name: HTTP_RETRY_COUNT
              value: {{ .Values.env.httpRetryCount | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
