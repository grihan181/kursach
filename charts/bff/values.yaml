replicaCount: 1

image:
  repository: bff
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources: {}

env:
  apiPrefix: /api
  authServiceUrl: http://auth:8080
  ordersServiceUrl: http://orders:8080
  chatServiceUrl: http://chat:8080
  jwtSecret: change-me
  httpTimeoutMs: 5000
  httpRetryCount: 2

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: example.local
      paths:
        - path: /api
          pathType: Prefix
  tls: []

livenessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10

metrics:
  enabled: true
  path: /metrics
