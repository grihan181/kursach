{{- if .Values.global.kafka.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "umbrella.kafkaSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "umbrella.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  username: {{ required "global.kafka.auth.username is required when Kafka auth is enabled" .Values.global.kafka.auth.username | quote }}
  password: {{ required "global.kafka.auth.password is required when Kafka auth is enabled" .Values.global.kafka.auth.password | quote }}
  securityProtocol: {{ default "SASL_PLAINTEXT" .Values.global.kafka.auth.securityProtocol | quote }}
  saslMechanism: {{ default "SCRAM-SHA-256" .Values.global.kafka.auth.saslMechanism | quote }}
{{- end }}
