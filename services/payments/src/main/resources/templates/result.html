<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Статус оплаты</title>
    <style>
        body { font-family: Inter, Arial, sans-serif; background: #eff3ff; margin: 0; padding: 40px; }
        .card { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 18px; padding: 32px; box-shadow: 0 12px 30px rgba(79,70,229,0.2); text-align: center; }
        h1 { margin-top: 0; font-size: 26px; }
        p { color: #475569; }
        .success { color: #0d9488; font-weight: 600; }
        .error { color: #dc2626; font-weight: 600; }
        a { display: inline-block; margin-top: 24px; color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <h1>Статус операции</h1>
    <p th:if="${order != null}" th:text="'Заявка: ' + ${order.title} + ' (' + ${order.reference} + ')'">Информация о заказе</p>
    <p class="success" th:if="${message != null}" th:text="${message}">Сообщение</p>
    <p class="error" th:if="${error != null}" th:text="${error}">Ошибка</p>
    <a th:href="${frontendUrl}" target="_blank">Вернуться в личный кабинет</a>
</div>
</body>
</html>
