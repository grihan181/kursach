apiVersion: v2
name: kursach
version: 0.1.0
description: Umbrella chart provisioning dedicated Postgres instances per service with optional Redis and migration jobs.
type: application

# Dependencies rely on upstream charts for actual Postgres/Redis deployments
# and are parameterized via values.yaml.
dependencies:
  - name: postgresql
    version: 15.5.23
    repository: https://charts.bitnami.com/bitnami
    alias: authPostgresql
    condition: authPostgresql.enabled
  - name: postgresql
    version: 15.5.23
    repository: https://charts.bitnami.com/bitnami
    alias: ordersPostgresql
    condition: ordersPostgresql.enabled
  - name: postgresql
    version: 15.5.23
    repository: https://charts.bitnami.com/bitnami
    alias: chatPostgresql
    condition: chatPostgresql.enabled
  - name: redis
    version: 19.6.2
    repository: https://charts.bitnami.com/bitnami
    alias: redis
    condition: redis.enabled
