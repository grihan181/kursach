image:
  repository: ghcr.io/example/kursach-frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: frontend.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  bffUrl: "http://bff:4000"
  wsUrl: "ws://bff:4000/ws"
resources: {}
