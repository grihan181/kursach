{{- $global := .Values.global -}}
{{- if .Values.auth }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      {{- if $global.imagePullSecrets }}
      imagePullSecrets:
      {{- range $global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - name: auth
          image: {{ .Values.auth.image }}
          ports:
            - containerPort: {{ .Values.auth.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: DB_HOST
              value: "{{ default (printf "%s-auth-postgres" .Release.Name) .Values.auth.database.host }}"
            - name: DB_PORT
              value: "{{ .Values.auth.database.port }}"
            - name: DB_NAME
              value: "{{ .Values.auth.database.name }}"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: password
            {{- range $key, $value := .Values.auth.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: {{ .Values.auth.service.port }}
{{- end }}

